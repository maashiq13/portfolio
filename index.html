                            <i class="fas fa-university text-green-500 mr-2"></i> M.S. in Cybersecurity (First Class Honors)
                         </div>
                         <div class="text-xs text-gray-400 mb-2">National College of Ireland, Ireland | 2022-2023</div>
                         
                         <div class="text-green-300 font-bold text-sm mb-0.5">Key Achievement:</div>
                         <div class="text-sm text-yellow-400 flex items-center">
                            <i class="fas fa-file-alt text-yellow-500 mr-2"></i> Published Research Thesis
                         </div>
                         <div class="text-xs text-gray-300 mt-0.5 font-medium">
                            Published at SINCONF 2023 (16th Int. Conference on Security of Information and Networks).
                         </div>
                    </div>

                    <div class="cert-block">
                         <div class="text-lg text-green-400 font-bold mb-1 flex items-center">
                            <i class="fas fa-graduation-cap text-green-500 mr-2"></i> B. Tech in Computer Science and Engineering
                         </div>
                         <div class="text-xs text-gray-400">SASTRA University, India | 2014-2018</div>
                    </div>
                </div>
            `,
            'certs-block': `
                <div class="text-md text-yellow-500 font-bold mb-3 border-b border-green-700 pb-1">PROFESSIONAL CREDENTIALS</div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="cert-block">
                        <div class="text-base text-yellow-400 font-bold mb-1 flex items-center">
                            <i class="fas fa-route text-blue-400 mr-2"></i> CCNA
                        </div>
                        <div class="text-xs text-gray-300">Cisco Certified Network Associate</div>
                    </div>
                    
                    <div class="cert-block">
                        <div class="text-base text-yellow-400 font-bold mb-1 flex items-center">
                            <i class="fas fa-ethernet text-green-400 mr-2"></i> JNCIA
                        </div>
                        <div class="text-xs text-gray-300">Juniper Certified Associate - Junos</div>
                    </div>
                    
                    <div class="cert-block border-dashed border-yellow-500">
                        <div class="text-base text-yellow-300 font-bold mb-1 flex items-center">
                            <i class="fas fa-hourglass-half text-yellow-500 mr-2"></i> JNCISP
                        </div>
                        <div class="text-xs text-gray-400">Juniper Specialist (In Progress)</div>
                    </div>
                </div>
            `,
            'value': `
                <div class="text-md text-yellow-500 font-bold mb-3 border-b border-green-700 pb-1">CORE VALUE PROPOSITION</div>

                <div class="space-y-3">
                    <div class="capability-block">
                        <div class="text-yellow-400 font-bold text-base flex items-center mb-1">
                            <i class="fas fa-flask text-yellow-400 mr-2"></i> [ APPLIED RESEARCH & ANALYSIS ]
                        </div>
                        <p class="text-xs text-green-300 font-semibold mb-2">Focus: Applying academic rigor to security research and SIEM analysis</p>
                        
                        <div class="space-y-1 text-sm text-gray-300">
                            <div><i class="fas fa-check text-green-400 mr-1.5"></i> Deep experience in <strong class="text-yellow-400">DDoS</strong> and <strong class="text-yellow-400">Malicious DNS</strong> threat detection.</div>
                            <div><i class="fas fa-check text-green-400 mr-1.5"></i> Validated analytical capability through peer-reviewed publication at SINCONF 2023.</div>
                        </div>
                    </div>
                    
                    <div class="capability-block">
                        <div class="text-yellow-400 font-bold text-base flex items-center mb-1">
                            <i class="fas fa-tools text-yellow-400 mr-2"></i> [ SECURITY SOLUTION ENGINEERING ]
                        </div>
                        <p class="text-xs text-green-300 font-semibold mb-2">Focus: Designing, deploying, and consulting on enterprise security architecture</p>

                        <div class="space-y-1 text-sm text-gray-300">
                            <div><i class="fas fa-check text-green-400 mr-1.5"></i> Authored over <strong class="text-yellow-400">20 technical bids</strong> for SOC solutions (SOAR, MSSP, Forensics, VAPT).</div>
                            <div><i class="fas fa-check text-green-400 mr-1.5"></i> Deployed critical security protocols and IAM/PAM solutions for offshore Data Centers.</div>
                        </div>
                    </div>
                    
                    <div class="capability-block">
                        <div class="text-yellow-400 font-bold text-base flex items-center mb-1">
                            <i class="fas fa-chart-line text-yellow-400 mr-2"></i> [ EXPERTISE EVOLUTION ]
                        </div>
                        <p class="text-xs text-green-300 font-semibold mb-2">Focus: Continuous mastery over network and security domains</p>

                        <div class="space-y-1 text-sm text-gray-300">
                            <div><i class="fas fa-check text-green-400 mr-1.5"></i> Holds vendor certifications: <strong class="text-yellow-400">CCNA, JNCIA-Junos</strong>.</div>
                            <div><i class="fas fa-check text-green-400 mr-1.5"></i> Actively pursuing <strong class="text-yellow-400">JNCISP certification</strong> to expand service-provider routing depth.</div>
                        </div>
                    </div>
                </div>
            `,
            'error': (cmd) => `<div class="text-red-500 font-bold">!! COMMAND UNKNOWN !!</div><div class="text-gray-400">Command <span class="text-red-400">'${cmd}'</span> not recognized. Type 'help' for available commands.</div>`
        };

        const terminalBody = document.getElementById('terminal-body');
        const commandInput = document.getElementById('command-input');
        
        const getInitialMessage = () => `
            <div class="text-green-400 text-lg font-bold mb-2">
                Welcome to the Aashiq Moosa Terminal Interface
            </div>
            <p class="text-yellow-400 text-sm mb-2">
                // ${profileData.name} - ${profileData.title}
            </p>
            <p class="text-gray-400 mb-4 text-xs">
                Establishing connection...
                <span id="typing-placeholder" class="text-green-400"></span><span class="cursor"></span>
            </p>
        `;

        function appendToTerminal(htmlContent) {
            const output = document.createElement('div');
            output.innerHTML = htmlContent;
            terminalBody.appendChild(output);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }
        
        function resetToWelcome() {
            terminalBody.innerHTML = '';
            window.typingInProgress = true; 
            window.typingIndex = 0;
            historyIndex = -1;
            terminalBody.innerHTML = getInitialMessage();
            typeWriter();
            terminalBody.scrollTop = 0;
        }

        function executeCommand(command) {
            const trimmedCommand = command.trim();
            const lowerCommand = trimmedCommand.toLowerCase();
            
            appendToTerminal(`<div class="text-yellow-400 mt-2 text-sm">aashiq@desktop:~/portfolio$ ${trimmedCommand}</div>`);

            if (trimmedCommand !== '' && lowerCommand !== 'clear' && lowerCommand !== 'start') {
                commandHistory.push(trimmedCommand);
            }
            historyIndex = commandHistory.length; 
            
            if (lowerCommand === 'clear' || lowerCommand === 'start') {
                resetToWelcome();
            } else if (sections[lowerCommand]) {
                terminalBody.innerHTML = ''; 
                appendToTerminal(`<div class="text-yellow-400 text-sm mb-2">aashiq@desktop:~/portfolio$ ${trimmedCommand}</div>`);
                appendToTerminal(`<div class="bg-gray-900/80 p-3 rounded-md border border-green-900/50">${sections[lowerCommand]}</div>`);
                terminalBody.scrollTop = 0;
            } else {
                appendToTerminal(sections['error'](trimmedCommand));
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }

            commandInput.value = '';
        }

        const placeholderText = 'Connection established. Use the quick menu or type \'help\'.';
        window.typingIndex = 0;
        const speed = 25; 
        window.typingInProgress = true;

        function typeWriter() {
            if (!window.typingInProgress) return;
            const typingPlaceholder = document.getElementById("typing-placeholder");
            if (!typingPlaceholder) return;

            if (window.typingIndex < placeholderText.length) {
                typingPlaceholder.textContent += placeholderText.charAt(window.typingIndex);
                window.typingIndex++;
                setTimeout(typeWriter, speed);
            } else {
                window.typingInProgress = false;
                const cursorElement = document.querySelector('.cursor');
                if (cursorElement) cursorElement.remove();
                
                appendToTerminal(`<div class="bg-gray-900/80 p-3 rounded-md border border-green-900/50 mt-3">${sections['help']}</div>`);
                terminalBody.scrollTop = 0;
                commandInput.focus();
            }
        }

        function navigateHistory(direction) {
            if (commandHistory.length === 0) return;

            if (direction === 'up') {
                if (historyIndex > 0) historyIndex--;
            } else if (direction === 'down') {
                if (historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                } else {
                    historyIndex = commandHistory.length;
                    commandInput.value = '';
                    return;
                }
            }
            
            if (historyIndex >= 0 && historyIndex < commandHistory.length) {
                commandInput.value = commandHistory[historyIndex];
            }
        }
        
        const startMatrixEffect = () => {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');
            
            let width = window.innerWidth;
            let height = window.innerHeight;
            
            let columns;
            const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{};:|,./<>?';
            const charSize = 18;
            let drops = [];

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                columns = Math.floor(width / charSize);
                
                drops = [];
                for (let i = 0; i < columns; i++) {
                    drops[i] = 1;
                }
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function draw() {
                ctx.fillStyle = 'rgba(15, 17, 26, 0.05)'; 
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = '#0F0';
                ctx.font = charSize + 'px Space Mono';

                for (let i = 0; i < drops.length; i++) {
                    const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                    ctx.fillText(text, i * charSize, drops[i] * charSize);

                    if (drops[i] * charSize > height && Math.random() > 0.99) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            setInterval(draw, 50); 
        };
        
        async function initApp() {
            try {
                if (firebaseConfig) {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    setLogLevel('Debug');
                    
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                    userId = auth.currentUser?.uid || 'anon_user';
                }
            } catch (error) {
                console.error("Firebase initialization failed:", error);
            }

            startMatrixEffect();
            resetToWelcome();

            commandInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    executeCommand(commandInput.value);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateHistory('up');
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateHistory('down');
                }
            });

            document.querySelectorAll('.gui-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    const command = e.currentTarget.getAttribute('data-command');
                    if (command) {
                        executeCommand(command);
                    }
                });
            });
            
            if (auth) {
                auth.onAuthStateChanged(user => {
                    const statusEl = document.getElementById('user-id-display');
                    if (statusEl) {
                        if (user) {
                             statusEl.innerHTML = `<i class="fas fa-user-check text-green-500 mr-1"></i> Auth: ${user.isAnonymous ? 'ANONYMOUS' : 'USER-SESSION'} ID: ${user.uid.substring(0, 8)}...`;
                        } else {
                             statusEl.innerHTML = `<i class="fas fa-user-secret text-red-500 mr-1"></i> Auth: LOGGED OUT`;
                        }
                    }
                });
            }
        }

        initApp();
    </script>
</body>
